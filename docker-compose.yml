services:
  php74:
    image: php:7.4-fpm
    container_name: php74
    tty: true
    working_dir: /var/www
    volumes: 
      - .:/var/www/    
    networks: 
      mikhmon_network:
        ipv4_address: 172.27.0.5
  nginx:
    image: nginx:alpine
    container_name: nginx
    tty: true
    volumes:
      - .:/var/www/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    networks:
      mikhmon_network:
        ipv4_address: 172.27.0.6
networks:
  mikhmon_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.27.0.0/24